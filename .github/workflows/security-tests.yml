name: Security Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: staycation_db
          POSTGRES_USER: staycation
          POSTGRES_PASSWORD: staycation_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: |
        cd backend
        npm ci

    - name: Create .env for tests
      run: |
        echo "POSTGRES_HOST=localhost" >> backend/.env
        echo "POSTGRES_PORT=5432" >> backend/.env
        echo "POSTGRES_DB=staycation_db" >> backend/.env
        echo "POSTGRES_USER=staycation" >> backend/.env
        echo "POSTGRES_PASSWORD=staycation_dev" >> backend/.env
        echo "JWT_SECRET=test_secret_for_ci_verification_only" >> backend/.env
        echo "NODE_ENV=test" >> backend/.env

    - name: Run Database Readiness Check
      run: |
        cd backend
        npm run db:check

    - name: Run Authorization Integration Tests
      run: |
        cd backend
        npm run test:authz

    - name: Run All Integration Tests
      run: |
        cd backend
        npm run test:integration
